[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cam350-mcp"
version = "0.1.0"
description = "MCP server controlling DownStream CAM350 12.x through its native macro language"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CAM350 MCP contributors" }]
keywords = ["mcp", "cam350", "pcb", "gerber", "drill", "drc", "panelization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp>=2.3.0",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/libai998/cam350-mcp"
Issues = "https://github.com/libai998/cam350-mcp/issues"

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=8.0"]

[project.scripts]
cam350-mcp = "cam350_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cam350_mcp = ["reference.json"]
